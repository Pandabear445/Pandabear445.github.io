services:
  app_proxy:
    environment:
      APP_HOST: hearth_web_1
      # Hearth's own port inside the container.
      APP_PORT: 3000

  web:
    # Before submitting: add the multi-arch index digest, ghcr.io/pandabear445/hearth:<version>@sha256:<digest>
    # (docker buildx imagetools inspect ghcr.io/pandabear445/hearth:<version>).
    image: ghcr.io/pandabear445/hearth:1.29.0
    restart: on-failure
    # Umbrel's app data belongs to uid 1000, the user Hearth runs as.
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      # Umbrel serves the https; Hearth speaks plain http on the private app network and refuses it from anywhere else.
      HTTPS: "false"
      # Umbrel's proxy passes each visitor's address on; believe it only from Umbrel's app network.
      TRUST_PROXY: "${NETWORK_IP}/16"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
