# coturn config for Hearth calls: the same locked-down settings scripts/setup-turn.sh writes.
# Easiest: sudo bash scripts/setup-turn.sh does all of this for you (and tells Hearth about the relay).
# By hand: sudo apt install coturn, copy this to /etc/turnserver.conf, change the two values marked CHANGE,
# then: sudo systemctl enable --now coturn. Open UDP+TCP 3478 and UDP 49160-49400 in your firewall.
# In Hearth's .env: TURN_URL=turn:<this server>:3478 and TURN_SECRET=<the same secret as below>.
listening-port=3478
# CHANGE: this server's public IP (behind NAT: public/private, e.g. 203.0.113.7/10.0.0.4).
external-ip=203.0.113.7
min-port=49160
max-port=49400
fingerprint
# Shared-secret mode: Hearth hands each signed-in person their own relay password that expires after 12 hours,
# so outsiders and people you remove can't use the relay. (Never a fixed user=name:password here.)
use-auth-secret
# CHANGE: remove the # and put a long random secret after the =, e.g. from: openssl rand -hex 32
# (Left like this, the relay accepts no one: a copied-but-unedited file never runs with a published secret.)
#static-auth-secret=
realm=hearth
# Limits so nobody can use this relay as a free bandwidth pipe.
total-quota=400
user-quota=16
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers
# Calls only relay UDP; refusing TCP relays (RFC 6062) removes a way to reach TCP services through the relay.
no-tcp-relay
# Never relay into private or internal networks (blocks a well-known TURN abuse: reaching the cloud metadata
# service, Docker networks or other machines on the provider's network through the relay).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
simple-log
