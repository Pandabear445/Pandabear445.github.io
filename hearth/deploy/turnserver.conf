# Minimal coturn config for Hearth voice. Install: sudo apt install coturn
# Copy to /etc/turnserver.conf, change the values, then: sudo systemctl enable --now coturn
# Open UDP+TCP 3478 and UDP 49160-49200 in your firewall.
listening-port=3478
fingerprint
lt-cred-mech
user=hearth:change-me
realm=hearth
min-port=49160
max-port=49200
# Your server's public IP:
external-ip=203.0.113.7
no-cli
no-tlsv1
no-tlsv1_1
