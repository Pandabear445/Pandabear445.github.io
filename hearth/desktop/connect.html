<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Connect</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 0%, rgba(242,165,65,.16), transparent 70%), #100e16; color: #ede9f5; font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-app-region: drag; }
    .card { width: min(420px, 92vw); padding: 32px; border-radius: 22px; background: #1a1724; border: 1px solid rgba(255,255,255,.1); -webkit-app-region: no-drag; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 22px; margin: 16px 0 4px; }
    p { margin: 0 0 18px; color: #b6afc6; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #b6afc6; margin-bottom: 6px; }
    input { width: 100%; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #110f18; color: inherit; font: inherit; outline: none; }
    input:focus { border-color: #f2a541; box-shadow: 0 0 0 3px rgba(242,165,65,.18); }
    button { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 10px; background: #f2a541; color: #1a1407; font: 600 15px system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: #ff7b8c; font-size: 13.5px; min-height: 20px; margin-top: 10px; }
    .hint { font-size: 12.5px; color: #847c97; margin-top: 14px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <img src="build/icon.png" alt="">
    <h1 id="title">Connect to your server</h1>
    <p>Enter the address of the Hearth server you use in your browser.</p>
    <label for="url">Server address</label>
    <input id="url" placeholder="chat.example.com" autocomplete="url" autofocus required>
    <button id="go" type="submit">Connect</button>
    <div class="err" id="err" role="alert"></div>
    <div class="hint">Your messages stay end-to-end encrypted. The app only talks to the server you enter here.</div>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('name')) document.getElementById('title').textContent = `Connect to ${q.get('name')}`;
    document.getElementById('err').textContent = q.get('error') || '';
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('go');
      btn.disabled = true; btn.textContent = 'Connecting…';
      const r = await window.hearthDesktop.connect(document.getElementById('url').value);
      if (!r.ok) { document.getElementById('err').textContent = r.error; btn.disabled = false; btn.textContent = 'Connect'; }
    });
  </script>
</body>
</html>
