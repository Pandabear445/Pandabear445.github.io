# Publishes the Hearth server as a Docker image on GitHub's container registry, for linux/amd64 and linux/arm64
# (64-bit ARM: Raspberry Pi 4 and 5, ARM VPSes, most home-server boxes):
#   ghcr.io/<owner, lower case>/hearth:<version>, :<major.minor> and :latest
#   Runs on tags like `hearth-v1.29.0` (the version must match hearth/package.json; `app-v*` tags are the apps'),
#   and from the Actions tab ("Run workflow"): on a hearth-v* tag it publishes that release again; on a branch it
#   only builds both platforms and scans the image, so you can check the arm64 build before tagging. Nothing is
#   pushed from a branch. The arm64 half is built under emulation (QEMU), so a run takes about 10–20 minutes.
#
#   Security: every job gets a read-only token; only "publish" may write packages, and it runs in the GitHub
#   environment "production", only for hearth-v* tags (add `hearth-v*` to that environment's allowed tags:
#   Settings > Environments > production). Actions are pinned to exact commits (the comment says which version;
#   Dependabot updates them), and checkouts don't keep the token. The image is scanned with Trivy (fails on fixable
#   high/critical, the same check as hearth-security.yml) in a job of its own, "scan", whose token can only read:
#   the scanner is outside code that downloads its own program and database while it runs, so it never shares a job
#   with the token that can push the image. "publish" waits for "scan" to pass, then builds the same commit again
#   (both platforms) and pushes it; no build cache is passed between the two jobs, so nothing the scan job could
#   write reaches the published image. The pushed image carries a build provenance attestation (mode=max: which
#   commit, workflow and steps made it) and an SBOM (every package inside), both public, like the image: neither
#   holds any secret, since the build takes no secrets or build arguments. Inspect them with
#     docker buildx imagetools inspect ghcr.io/pandabear445/hearth:<version> --format '{{ json .Provenance }}'
#   After the first publish: GitHub > your profile > Packages > hearth > Package settings > Change visibility to
#   public, and link it to this repository, so people can pull it without signing in.
name: Hearth image

on:
  push:
    tags: ['hearth-v*']
  workflow_dispatch:

# Least privilege: read-only unless a job says otherwise.
permissions:
  contents: read

concurrency:
  group: hearth-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every run: build for this runner (amd64) and scan it. Read-only token, nothing pushed; on a release tag, the
  # tag is checked against package.json here too, so a mismatch fails before "publish" starts.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the scanner never runs next to a token that can write packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches hearth/package.json
        if: startsWith(github.ref, 'refs/tags/hearth-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./hearth/package.json').version")
          case "$version" in
            *[!0-9.]*|'') echo "::error::Only plain X.Y.Z releases are published (package.json says $version)"; exit 1 ;;
          esac
          if [ "$TAG" != "hearth-v$version" ]; then
            echo "::error::The tag $TAG doesn't match hearth/package.json ($version). Tag hearth-v$version instead."
            exit 1
          fi
      # Docker Hub rate-limits shared runners: fetch the base image through Google's mirror of it first.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build for this runner (amd64), to scan it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hearth
          platforms: linux/amd64
          load: true
          tags: hearth:scan
          provenance: false
          sbom: false
      - name: Scan the image (fails on fixable high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hearth:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  # A manual run on a branch: after the scan, build both platforms, push nothing.
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/hearth-v') }}
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build both platforms (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hearth
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

  # A release tag, once the scan passed: build both platforms and push. No scanner or other outside tool runs here.
  publish:
    if: startsWith(github.ref, 'refs/tags/hearth-v')
    needs: scan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # to push to ghcr.io; GITHUB_TOKEN only, no other secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches hearth/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./hearth/package.json').version")
          case "$version" in
            *[!0-9.]*|'') echo "::error::Only plain X.Y.Z releases are published (package.json says $version)"; exit 1 ;;
          esac
          if [ "$TAG" != "hearth-v$version" ]; then
            echo "::error::The tag $TAG doesn't match hearth/package.json ($version). Tag hearth-v$version instead."
            exit 1
          fi
      - name: Image name (registries want lower case)
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/hearth" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Multi-platform images: put the description on the index too, where the registry page reads it.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},match=^hearth-v(\d+\.\d+\.\d+)$
            type=semver,pattern={{major}}.{{minor}},match=^hearth-v(\d+\.\d+\.\d+)$
          labels: |
            org.opencontainers.image.title=Hearth
            org.opencontainers.image.description=Self-hosted chat for friend groups and small communities: servers, voice, video and screen sharing, with messages, files and calls end-to-end encrypted in the app.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://pandabear445.github.io/Hearth-chat
          annotations: |
            org.opencontainers.image.title=Hearth
            org.opencontainers.image.description=Self-hosted chat for friend groups and small communities: servers, voice, video and screen sharing, with messages, files and calls end-to-end encrypted in the app.
            org.opencontainers.image.licenses=MIT
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both platforms and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hearth
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
